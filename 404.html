<script>
/* Smart redirect, before anything is drawn: if the address clearly points to a
   page (any case, with or without .html, English or Dutch), go straight there so
   the visitor never sees this 404 page. Unclear addresses stay here with links. */
(function(){
  var ROUTES=[
    [/^(index|home|homepage|start)$/,'index.html'],
    [/\b(financial|finance|financieel|financien|advisory|advies|cfo|accounting|boekhouding|tax|belasting|fa)\b/,'financial-advisory.html'],
    [/\b(ai|tech|technology|technologie|data|automation|automatisering|website|web|ta)\b/,'ai-technology.html'],
    [/\b(marketing|growth|groei|social|socials|content|mg)\b/,'marketing-growth.html'],
    [/\b(contact|mail|email|e mail)\b/,'index.html#contact'],
    [/\b(about|over|overons|team)\b/,'index.html#about'],
    [/\b(services|service|diensten|dienst)\b/,'index.html#services'],
    [/\b(work|projects|projecten|portfolio|cases|werk)\b/,'index.html#work'],
    [/\b(readiness|tools)\b/,'tools/readiness.html']
  ];
  var root=location.pathname.indexOf('/STAC/')===0?'/STAC/':'/';
  var slug=location.pathname.slice(root.length);
  try{ slug=decodeURIComponent(slug); }catch(e){}
  var words=slug.toLowerCase().replace(/\.html?$/,'').replace(/\/+$/,'').replace(/[^a-z0-9]+/g,' ').trim();
  if(!words) return;
  var target=null;
  for(var i=0;i<ROUTES.length&&!target;i++) if(ROUTES[i][0].test(words)) target=ROUTES[i][1];
  if(!target) return;
  // Record the old address in the visitor stats without making anyone wait:
  // a beacon is sent in the background and survives the page change.
  if(!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&navigator.sendBeacon){
    try{
      navigator.sendBeacon('https://stac.goatcounter.com/count?p='+encodeURIComponent(location.pathname)+
        '&t='+encodeURIComponent('404 redirected to '+target)+'&r='+encodeURIComponent(document.referrer)+
        '&e=false&rnd='+Math.random().toString(36).slice(2));
    }catch(e){}
  }
  location.replace(root+target);   // replace() keeps the broken address out of the history
})();
</script>

<script>
(function(){
  function apply(lang){
    document.querySelectorAll('[data-nl]').forEach(function(el){
      if(el.dataset.enCache===undefined) el.dataset.enCache=el.innerHTML;
      el.innerHTML=lang==='nl'?el.getAttribute('data-nl'):el.dataset.enCache;
    });
    document.getElementById('ben').className='lb'+(lang==='en'?' on':'');
    document.getElementById('bnl').className='lb'+(lang==='nl'?' on':'');
    if(window.stacLangExtras) stacLangExtras(lang);
    try{localStorage.setItem('stac_lang',lang);}catch(e){}
  }
  document.getElementById('ben').addEventListener('click',function(){apply('en');});
  document.getElementById('bnl').addEventListener('click',function(){apply('nl');});
  var saved='en'; try{saved=localStorage.getItem('stac_lang')||'en';}catch(e){}
  apply(saved);
})();
</script>
